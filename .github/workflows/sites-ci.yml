name: Reframe checks
on:
  pull_request:
  push:
    branches: [main, forge/reframe-mvp]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:releases
      - uses: actions/upload-artifact@v4
        with:
          name: verified-build
          path: dist/
          retention-days: 3
